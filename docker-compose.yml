services:
  app:
    build:
      context: .
    image: printtool:latest
    container_name: printtool
    # Host-Netz ist Pflicht für CUPS/mDNS-Discovery.
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      - ./volumes/data:/app/data
      - ./volumes/uploads:/app/uploads
      - ./volumes/cups-pdf:/var/spool/cups-pdf
      - ./volumes/cups/config:/etc/cups
      - ./volumes/cups/spool:/var/spool/cups
      - ./volumes/cups/log:/var/log/cups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Brücke zwischen Traefik-Netz und der App im Host-Netz.
  proxy:
    image: caddy:2-alpine
    container_name: printtool-proxy
    entrypoint: ["caddy"]
    command: ["reverse-proxy", "--from", ":8080", "--to", "http://host.docker.internal:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.printtool.rule=Host(`${HOST:?HOST muss in .env gesetzt sein}`)"
      - "traefik.http.routers.printtool.entrypoints=websecure"
      - "traefik.http.routers.printtool.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-myresolver}"
      - "traefik.http.services.printtool.loadbalancer.server.port=8080"
    restart: unless-stopped

networks:
  traefik:
    name: traefik
    external: true
