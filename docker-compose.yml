services:
  app:
    build:
      context: .
    image: printtool:latest
    container_name: printtool
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      - ./volumes/data:/app/data
      - ./volumes/uploads:/app/uploads
      - ./volumes/cups-pdf:/var/spool/cups-pdf
      - ./volumes/cups/config:/etc/cups
      - ./volumes/cups/spool:/var/spool/cups
      - ./volumes/cups/log:/var/log/cups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
