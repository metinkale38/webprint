[project]
name = "printtool-backend"
version = "0.8.1"
description = "PrintTool FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "zeroconf>=0.132",
    "pypdf>=4.3",
    "Pillow>=10.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
